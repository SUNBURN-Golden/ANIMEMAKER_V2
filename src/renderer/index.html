<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' file:; img-src 'self' file: data: blob:; media-src 'self' file: blob:; style-src 'self' 'unsafe-inline' file:; script-src 'self' file:; connect-src 'self' file:">
  <title>AnimeMaker V2 - 셀 애니메이션 뮤직비디오 제작기</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <img src="assets/icon.png" alt="">
        <div>
          <div class="brand-name">AnimeMaker <span class="v2">V2</span></div>
          <div class="brand-sub">손그림 애니 뮤직비디오</div>
        </div>
      </div>
      <nav id="nav">
        <button data-view="home" class="nav-item"><span class="ico">🎬</span>새 에피소드 만들기</button>
        <button data-view="series" class="nav-item"><span class="ico">📺</span>시리즈</button>
        <button data-view="characters" class="nav-item"><span class="ico">🧒</span>캐릭터</button>
        <button data-view="projects" class="nav-item"><span class="ico">📂</span>내 작업</button>
        <button data-view="workflows" class="nav-item"><span class="ico">🧩</span>워크플로우</button>
        <button data-view="settings" class="nav-item"><span class="ico">🔌</span>AI 연결 설정</button>
        <button data-view="help" class="nav-item"><span class="ico">❓</span>사용 방법</button>
      </nav>
      <div class="side-foot">
        <div class="lock-badge" title="이 앱은 API 키(종량제 과금)를 쓰지 않습니다. 구독 중인 서비스의 사용 한도 안에서만 동작합니다.">🔒 구독 전용 · 추가 과금 없음</div>
        <div id="side-running"></div>
      </div>
    </aside>
    <main id="main"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="js/ui.js"></script>
  <script src="js/lyricsync.js"></script>
  <script src="js/home.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/series.js"></script>
  <script src="js/project.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/workflows.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/help.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
