name: AnimeMaker V2 Windows 설치 파일 만들기

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 테스트 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 사이 그림 엔진 RIFE 캐시
        uses: actions/cache@v4
        with:
          path: vendor/rife/.cache
          key: rife-ncnn-vulkan-20221029-${{ runner.os }}
      - name: 사이 그림 엔진 RIFE 받기 (테스트에서 직접 돌려 보기)
        run: node scripts/fetch-rife.js
      - name: Vulkan 로더 (리눅스, 없을 때만 설치)
        if: runner.os == 'Linux'
        run: ldconfig -p | grep -q libvulkan.so.1 || (sudo apt-get update -qq && sudo apt-get install -y -qq libvulkan1)
      - run: npm test
        env:
          ANIMEMAKER_RIFE_DIR: ${{ github.workspace }}/vendor/rife/${{ runner.os == 'Windows' && 'win32' || 'linux' }}-x64
      - name: 윈도우 - Vulkan 로더를 넣고 RIFE 를 실제로 돌려 보기 (그래픽카드가 없으면 CPU)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ANIMEMAKER_RIFE_DIR: ${{ github.workspace }}\vendor\rife\win32-x64
          ANIMEMAKER_REQUIRE_RIFE: '1'
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'vulkan-rt.zip'
          Invoke-WebRequest -Uri 'https://sdk.lunarg.com/sdk/download/1.4.363.0/windows/vulkan-runtime-components.zip' -OutFile $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($sha -ne 'A25A927AA8B9F0371048F1861CF88AC3B9BC9B1FB332C42D897C8AB32695769A') { throw "Vulkan 런타임 SHA256 이 다릅니다: $sha" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'vulkan-rt')
          Copy-Item (Join-Path $env:RUNNER_TEMP 'vulkan-rt\VulkanRT-X64-1.4.363.0-Components\x64\vulkan-1.dll') $env:ANIMEMAKER_RIFE_DIR
          node --test --test-reporter=spec test/inbetween.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-installer:
    name: AnimeMaker V2 Windows 설치 파일 (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 사이 그림 엔진 RIFE 캐시
        uses: actions/cache@v4
        with:
          path: vendor/rife/.cache
          key: rife-ncnn-vulkan-20221029-windows
      - name: 사이 그림 엔진 RIFE 받기 (SHA256 확인 후 필요한 파일만)
        run: node scripts/fetch-rife.js --platform win32 --arch x64
      - name: 설치 파일 빌드
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 설치 파일 안에 RIFE 가 들어갔는지 확인
        shell: pwsh
        run: |
          foreach ($f in 'rife-ncnn-vulkan.exe', 'vcomp140.dll', 'LICENSE', 'rife-v4.6\flownet.bin', 'rife-v4.6\flownet.param') {
            if (-not (Test-Path (Join-Path 'dist\win-unpacked\resources\rife' $f))) { throw "설치 파일에 rife\$f 가 없습니다" }
          }
          Get-ChildItem -Recurse dist\win-unpacked\resources\rife | Select-Object FullName, Length
      - name: 결과물 올리기
        uses: actions/upload-artifact@v4
        with:
          name: AnimeMaker-V2-Windows
          path: dist/AnimeMaker-V2-*.exe
          if-no-files-found: error
          retention-days: 30
      - name: 릴리스에 올리기 (v 로 시작하는 태그일 때만)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AnimeMaker-V2-*.exe

  android-apk:
    name: AnimeMaker V2 안드로이드 앱 (.apk)
    runs-on: ubuntu-latest
    env:
      # 서명 인증서 SHA-256 (소문자 16진수). mobile/android/README-signing.md 와 같아야 한다.
      # 서명 키를 바꾸면(= 사용자가 앱을 지우고 다시 깔아야 한다) 여기도 새 값으로 고친다.
      AM_CERT_SHA256: 5adffa13e8f9aa3d1d37592e53c41210f9fbcc11d577ebb38cda2f679b47527f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Gradle 캐시 (Gradle 배포판 · 안드로이드 라이브러리를 매번 새로 받지 않게)
        uses: gradle/actions/setup-gradle@v4
      - name: PC 앱 패키지 (공용 계산 코드)
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: 폰 앱 패키지
        run: npm ci
        working-directory: mobile
      - name: 공용 코드 순수성 검사 (PC 와 폰이 같이 쓰는 파일이 Node 전용 기능을 안 쓰는지)
        run: |
          if [ -f test/shared-purity.test.js ]; then
            node --test test/shared-purity.test.js
          else
            echo "test/shared-purity.test.js 가 아직 없어 건너뛰어요"
          fi
      - name: 폰 앱 테스트 (계산 단위 시험 + Chrome 으로 화면 확인)
        run: npm test
        working-directory: mobile
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: 앱 화면 묶기 · 안드로이드 프로젝트에 넣기
        run: |
          npm run build
          npx cap sync android
        working-directory: mobile
      - name: APK 빌드 (release, 서명)
        run: |
          V=$(node -p "require('./package.json').version")
          cd android
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName="$V"
        working-directory: mobile
      - name: APK 이름·서명 확인
        run: |
          set -euo pipefail
          V=$(node -p "require('./mobile/package.json').version")
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          BADGING=$("$BT/aapt2" dump badging "$APK")
          grep -E "^package:|^application-label:|^uses-permission:" <<<"$BADGING" || true
          grep -q "^package: name='com.animemaker.v2' " <<<"$BADGING" || { echo "::error::패키지 이름이 com.animemaker.v2 가 아니에요"; exit 1; }
          grep -q "^application-label:'AnimeMaker V2'$" <<<"$BADGING" || { echo "::error::앱 이름(label)이 'AnimeMaker V2' 가 아니에요"; exit 1; }
          grep -q "versionName='$V'" <<<"$BADGING" || { echo "::error::versionName 이 $V 가 아니에요"; exit 1; }
          grep -q "versionCode='${{ github.run_number }}'" <<<"$BADGING" || { echo "::error::versionCode 가 ${{ github.run_number }} 가 아니에요"; exit 1; }
          if grep -q "^application-debuggable" <<<"$BADGING"; then echo "::error::디버그용 APK 예요 (release 여야 해요)"; exit 1; fi
          MANIFEST=$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK")
          if grep -q "com.animemaker.mobile" <<<"$MANIFEST"; then echo "::error::V1 이름(com.animemaker.mobile)이 매니페스트에 남아 있어요"; exit 1; fi
          if unzip -p "$APK" 'classes*.dex' | grep -aq "com/animemaker/mobile"; then echo "::error::V1 이름(com/animemaker/mobile)이 코드에 남아 있어요"; exit 1; fi
          SHA=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "서명 인증서 SHA-256: $SHA"
          [ "$SHA" = "$AM_CERT_SHA256" ] || { echo "::error::서명 인증서가 달라요 (기대 $AM_CERT_SHA256, 실제 $SHA). 키를 바꾸면 업데이트 설치가 안 돼요."; exit 1; }
      - name: 파일 이름 정리
        run: |
          V=$(node -p "require('./mobile/package.json').version")
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "dist/AnimeMaker-V2-${V}-android.apk"
          ls -l dist
      - name: 결과물 올리기
        uses: actions/upload-artifact@v4
        with:
          name: AnimeMaker-V2-Android
          path: dist/AnimeMaker-V2-*-android.apk
          if-no-files-found: error
          retention-days: 30
      - name: 릴리스에 올리기 (v 로 시작하는 태그일 때만)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AnimeMaker-V2-*-android.apk
